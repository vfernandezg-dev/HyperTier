[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hypertier"
dynamic = ["version"]
description = "Tiered-memory inference runtime: run huge AI models on small GPUs (early development)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Valentin Fernandez", email = "me@vfernandezg.dev" }]
keywords = [
  "llm", "inference", "vram", "offloading", "mixture-of-experts",
  "diffusion", "kv-cache", "quantization", "triton", "pytorch",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies (torch, triton, safetensors) will be added with the
# first functional release; the placeholder installs nothing heavy.
dependencies = []

[project.optional-dependencies]
# Hugging Face adapter (hypertier.adapters). 5.24 is the oldest release it is tested with.
hf = ["transformers>=5.24"]
# Diffusion adapter (hypertier.adapters.hf_diffusers). 0.43 is the oldest release it is tested
# with. transformers is for the text encoder, and ftfy cleans prompts as the pipelines of
# diffusers do: without it the same prompt gives other tokens.
diffusers = ["diffusers>=0.43", "transformers>=5.24", "ftfy"]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]
# What the model tests and bench_llm need on a machine with a GPU, besides torch. accelerate
# is only a baseline to compare against: nothing in the package imports it. nvidia-ml-py
# (BSD) is optional at run time: with it the VRAM of the process is read through NVML, and
# without it through nvidia-smi; it is here so that the tests run the first way (tested with
# 13.615; one too old to be used falls back to nvidia-smi). CI installs "dev" alone and skips
# these tests.
test = ["transformers>=5.24", "accelerate>=1.16", "diffusers>=0.43", "ftfy", "nvidia-ml-py"]
# bench_video writes its video as an MP4 with these, and as an animated WebP without them.
# 2.38 and 0.8 are the oldest releases it is tested with. Not part of "test": both are
# BSD-2-Clause, but the wheel of imageio-ffmpeg carries an ffmpeg executable under the GPL
# (version 3 or later), which runs as a program of its own.
video = ["imageio>=2.38", "imageio-ffmpeg>=0.8"]

[project.urls]
Homepage = "https://github.com/vfernandezg-dev/HyperTier"
Repository = "https://github.com/vfernandezg-dev/HyperTier"
Issues = "https://github.com/vfernandezg-dev/HyperTier/issues"

[tool.hatch.version]
path = "src/hypertier/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hypertier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: needs a CUDA GPU; skipped automatically when none is available",
    "slow: runs on real checkpoints (HYPERTIER_MODELS) and takes minutes; run with -m slow",
]
# The slow tests are left out unless asked for: pytest -m slow runs them alone, and
# pytest -m "slow or not slow" runs everything.
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
